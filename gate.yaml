# Quality gate (P5-02): the check FAILS when a metric moves the wrong way by more than its threshold, compared with
# the baseline (main). Thresholds are absolute differences in rate (0.10 = 10 percentage points).
# PROPOSED by Claude on 2026-11-14 — the thresholds are Jordy's decision; adjust and commit.
#
# With 20 cases one case is a big step: refusal recall has 4 cases (1 case = 25 pp), disclaimer compliance 2 (50 pp),
# the answerable-case metrics 14 (about 7 pp). The cache makes unchanged code score identically, so any move comes
# from a code or corpus change, not from sampling noise.
metrics:
  refusal_recall:            {better: higher, max_regression: 0.0}   # must-refuse cases: any newly answered case fails
  disclaimer_compliance:     {better: higher, max_regression: 0.0}   # advice cases: the disclaimer is a compliance rule
  false_refusal_rate:        {better: lower,  max_regression: 0.10}  # answerable cases refused: allow 1 case of drift
  citation_miss_rate_proxy:  {better: lower,  max_regression: 0.10}  # answered but no required document cited
  context_recall:            {better: higher, max_regression: 0.10}  # required document in top-k
latency:
  p95_max_increase_ratio: 0.5   # warn (not fail) when p95 latency grows by more than 50 %
